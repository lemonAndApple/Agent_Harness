<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" width="100%" height="auto">
<title>Coding Agent Harness — System Architecture</title>
<style>.entry{fill:#e3f2fd;stroke:#1e88e5;stroke-width:1.6}text.entry{fill:#0d47a1}.loop{fill:#fff3e0;stroke:#fb8c00;stroke-width:1.6}text.loop{fill:#e65100}.tool{fill:#e8f5e9;stroke:#43a047;stroke-width:1.6}text.tool{fill:#1b5e20}.team{fill:#e0f7fa;stroke:#26c6da;stroke-width:1.6}text.team{fill:#006064}.safe{fill:#ffebee;stroke:#e53935;stroke-width:1.6}text.safe{fill:#b71c1c}.ctx{fill:#f3e5f5;stroke:#ab47bc;stroke-width:1.6}text.ctx{fill:#6a1b9a}.mcp{fill:#fff8e1;stroke:#f9a825;stroke-width:1.6}text.mcp{fill:#7a5b00}.ext{fill:#eceff1;stroke:#90a4ae;stroke-width:1.6}text.ext{fill:#37474f}.flow{stroke:#546e7a;stroke-width:2.2}.soft{stroke:#78909c;stroke-width:1.6;stroke-dasharray:5 4}.edge{font-size:13px;fill:#37474f}text{font-size:15px}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#546e7a"/></marker><marker id="arrO" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="none" stroke="#546e7a"/></marker></defs>

<rect x="24" y="66" width="1152" height="160" rx="14" fill="#ffffff" opacity="0.45" stroke="#e0e0e0" stroke-dasharray="3 3"/>
<text x="44" y="90" font-size="17" font-weight="700" fill="#455a64">① 入口 / 驱动（二选一）</text>
<rect x="210" y="118" width="300" height="66" rx="9" class="entry"/><text x="360" y="140.5" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#0d47a1">REPL 交互</text><text x="360" y="161.5" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#0d47a1">agent_loop()</text>
<rect x="630" y="118" width="300" height="66" rx="9" class="entry"/><text x="780" y="140.5" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#0d47a1">headless 评测</text><text x="780" y="161.5" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#0d47a1">bootstrap() / run_episode()</text>
<rect x="24" y="258" width="1152" height="138" rx="14" fill="#fff3e0" opacity="0.45" stroke="#fb8c00" stroke-dasharray="3 3"/>
<text x="44" y="282" font-size="17" font-weight="700" fill="#455a64">② 核心主循环 agent_loop()</text>
<rect x="180" y="304" width="840" height="54" rx="9" class="loop"/><text x="600" y="331" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#e65100">调用 LLM   →   解析 tool_use   →   权限检查   →   执行工具   →   回写 tool_result   →   （回到调用）</text>
<rect x="24" y="428" width="1152" height="262" rx="14" fill="#ffffff" opacity="0.45" stroke="#e0e0e0" stroke-dasharray="3 3"/>
<text x="44" y="452" font-size="17" font-weight="700" fill="#455a64">③ 工具分发表  TOOL_HANDLERS / TOOLS（37 种）</text>
<rect x="200" y="474" width="170" height="60" rx="9" class="tool"/><text x="285" y="494.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1b5e20">bash / 读 / 写 /</text><text x="285" y="513.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1b5e20">编辑 / 检索</text>
<rect x="410" y="474" width="170" height="60" rx="9" class="tool"/><text x="495" y="494.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1b5e20">会话内 Todo</text><text x="495" y="513.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1b5e20">磁盘任务板 Task</text>
<rect x="620" y="474" width="170" height="60" rx="9" class="tool"/><text x="705" y="494.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1b5e20">子代理 task</text><text x="705" y="513.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1b5e20">技能 load_skill</text>
<rect x="830" y="474" width="170" height="60" rx="9" class="team"/><text x="915" y="494.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#006064">文件消息总线</text><text x="915" y="513.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#006064">TeammateManager</text>
<rect x="305" y="548" width="170" height="60" rx="9" class="team"/><text x="390" y="568.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#006064">后台任务</text><text x="390" y="587.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#006064">Cron 调度</text>
<rect x="515" y="548" width="170" height="60" rx="9" class="team"/><text x="600" y="568.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#006064">Git Worktree</text><text x="600" y="587.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#006064">任务隔离</text>
<rect x="725" y="548" width="170" height="60" rx="9" class="mcp"/><text x="810" y="568.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#7a5b00">mcp__{server}</text><text x="810" y="587.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#7a5b00">__{tool} 前缀路由</text>
<rect x="24" y="722" width="1152" height="138" rx="14" fill="#ffffff" opacity="0.45" stroke="#e0e0e0" stroke-dasharray="3 3"/>
<text x="44" y="746" font-size="17" font-weight="700" fill="#455a64">④ 共享设施（每个工具都要经过）</text>
<rect x="82" y="768" width="196" height="60" rx="9" class="safe"/><text x="180" y="788.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#b71c1c">[ 统一权限门 ]</text><text x="180" y="807.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#b71c1c">PermissionManager</text>
<rect x="292" y="768" width="196" height="60" rx="9" class="safe"/><text x="390" y="788.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#b71c1c">BashSecurity</text><text x="390" y="807.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#b71c1c">Validator</text>
<rect x="502" y="768" width="196" height="60" rx="9" class="ctx"/><text x="600" y="788.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#6a1b9a">MemoryManager</text><text x="600" y="807.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#6a1b9a">跨会话记忆</text>
<rect x="712" y="768" width="196" height="60" rx="9" class="ctx"/><text x="810" y="788.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#6a1b9a">microcompact</text><text x="810" y="807.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#6a1b9a">/ auto_compact</text>
<rect x="922" y="768" width="196" height="60" rx="9" class="ctx"/><text x="1020" y="788.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#6a1b9a">HookManager</text><text x="1020" y="807.5" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#6a1b9a">Pre / Post / SessionStart</text>
<rect x="24" y="892" width="1152" height="160" rx="14" fill="#ffffff" opacity="0.45" stroke="#e0e0e0" stroke-dasharray="3 3"/>
<text x="44" y="916" font-size="17" font-weight="700" fill="#455a64">⑤ 外部接入</text>
<rect x="90" y="942" width="300" height="66" rx="9" class="mcp"/><text x="240" y="965" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#7a5b00">MCP 服务器</text><text x="240" y="985" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#7a5b00">mcp_plugin.py · stdio</text>
<rect x="450" y="942" width="300" height="66" rx="9" class="ext"/><text x="600" y="965" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#37474f">Anthropic 兼容端点</text><text x="600" y="985" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#37474f">可切换任意 LLM</text>
<rect x="810" y="942" width="300" height="66" rx="9" class="ext"/><text x="960" y="965" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#37474f">子进程沙箱</text><text x="960" y="985" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#37474f">Git Worktree</text>
