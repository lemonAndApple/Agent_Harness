name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic python-dotenv pytest

      - name: Run Python tests
        run: python -m pytest tests/test_agents_smoke.py tests/test_mcp_integration.py -q
